version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiendatap-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-tiendatap}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - HOST=0.0.0.0
      - PORT=3000
      - NEXTAUTH_URL=https://tiendatap.com
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - UPLOAD_PATH=/app/uploads
      - CONTACT_WHATSAPP=${CONTACT_WHATSAPP:-+524622222741}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
    networks:
      - tiendatap-net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --try-once --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  db:
    image: postgres:16-alpine
    container_name: tiendatap-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-tiendatap}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tiendatap-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tiendatap-cloudflared
    restart: unless-stopped
    network_mode: host
    volumes:
      - /datos/cloudflared:/etc/cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
volumes:
  pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /datos/data/tiendatap-pgdata
networks:
  tiendatap-net:
    driver: bridge
